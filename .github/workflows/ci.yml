# Plinto depends on @obelum/core and @obelum/translator-claude. Both are on
# npm, but CI tests against Obelum's main rather than its last release, the
# way the local workspace does: both repos checked out side by side under one
# throwaway npm workspace root. To test against the release instead, drop the
# obelum checkout and the root package.json and run `npm ci` here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plinto
      - uses: actions/checkout@v4
        with:
          repository: maxmart/obelum
          path: obelum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: workspace root spanning both repos
        run: |
          cat > package.json <<'JSON'
          { "name": "ci-workspace", "private": true,
            "workspaces": ["obelum/packages/*", "plinto/packages/*", "plinto/examples/*"] }
          JSON
      - run: npm install
      - run: npm run build
        working-directory: obelum
      - run: npm test
        working-directory: plinto
      - run: npm run typecheck
        working-directory: plinto
      - run: npm run build --workspace=examples/playground
        working-directory: plinto
