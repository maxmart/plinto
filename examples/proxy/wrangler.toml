name = "plinto-proxy"
main = "worker.js"
compatibility_date = "2026-06-01"

[vars]
# The origins your admin is served from. The worker refuses every browser
# request from anywhere else, so list each hostname you actually use — the
# apex and www are two origins — and keep localhost for `astro dev`.
ALLOWED_ORIGINS = "https://example.com,https://www.example.com,http://localhost:*"
# GitHub, plus where GitHub keeps LFS objects.
ALLOWED_TARGETS = "github.com,*.githubusercontent.com,*.amazonaws.com"
